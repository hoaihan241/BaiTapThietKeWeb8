<!DOCTYPE html>
<html>
<head>
<style type="text/css">
body {margin: 30px;}
</style>
<meta charset="utf-8" />
<title>Remove items from a dropdown list</title>
<script>
    function removecolor() {
        // Lấy thẻ select thông qua id
        var selectElement = document.getElementById("colorSelect");
        
        // Lấy vị trí (index) của tùy chọn đang được người dùng chọn
        var selectedIndex = selectElement.selectedIndex;
        
        // Kiểm tra nếu có mục được chọn thì tiến hành xóa
        // selectedIndex sẽ trả về -1 nếu không có mục nào được chọn
        if (selectedIndex !== -1) {
            selectElement.remove(selectedIndex);
        }
    }
</script>
</head><body><form>
<select id="colorSelect">
<option>Red</option>
<option>Green</option>
<option>White</option>
<option>Black</option>
</select>
<input type="button" onclick="removecolor()" value="Select and Remove">
</form></body></html>
