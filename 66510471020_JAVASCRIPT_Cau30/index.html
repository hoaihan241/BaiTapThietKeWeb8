<!DOCTYPE html>
<html><head>
<meta charset="utf-8" />
<title>Insert row in a table w3resource</title>
<script>
    function insert_Row() {
        // Lấy phần tử bảng thông qua id
        var table = document.getElementById("sampleTable");
        
        // Chèn một hàng mới (tr) vào cuối bảng bằng cách truyền tham số -1
        var newRow = table.insertRow(-1);
        
        // Chèn 2 ô mới (td) vào hàng vừa tạo
        var cell1 = newRow.insertCell(0);
        var cell2 = newRow.insertCell(1);
        
        // Cập nhật nội dung cho 2 ô theo yêu cầu
        cell1.innerHTML = "New cell1";
        cell2.innerHTML = "New cell2";
    }
</script>
</head><body>
<table id="sampleTable" border="1">
<tr><td>Row1 cell1</td>
<td>Row1 cell2</td></tr>
<tr><td>Row2 cell1</td>
<td>Row2 cell2</td></tr>
</table><br>
<input type="button" onclick="insert_Row()" value="Insert row">
</body></html>
