<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Return first and last name from a form</title>
<script>
    function getFormvalue(event) {
        // Ngăn chặn hành vi mặc định tải lại trang của form
        event.preventDefault();

        // Cách 1: Truy xuất qua document.forms
        var form = document.forms["form1"];
        var firstName = form.elements["fname"].value;
        var lastName = form.elements["lname"].value;

        /* Cách 2: Truy xuất qua document.getElementById hoặc getElementsByName
        var firstName = document.getElementsByName("fname")[0].value;
        var lastName = document.getElementsByName("lname")[0].value;
        */

        // Hiển thị hộp thoại kết quả
        alert("Họ và tên: " + firstName + " " + lastName);
    }
</script>
</head>
<body>
<!-- Truyền đối số event vào hàm hoặc sử dụng onsubmit="return getFormvalue()" -->
<form id="form1" onsubmit="getFormvalue(event)">
First name: <input type="text" name="fname" value=""><br>
Last name: <input type="text" name="lname" value=""><br>
<input type="submit" value="Submit">
</form>
</body>
</html>
