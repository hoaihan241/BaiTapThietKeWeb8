<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xuất thứ trong tuần</title>
    <link rel="stylesheet" href="/Style/style.css">
</head>
<body>

    <table class="date-table">
        <tr>
            <td class="input-cell">
                <label for="ngay">Ngày</label>
                <input type="number" id="ngay" min="1" max="31">
            </td>
            <td class="input-cell">
                <label for="thang">Tháng Select:</label>
                <input type="number" id="thang" min="1" max="12">
            </td>
            <td class="input-cell">
                <label for="nam">năm</label>
                <input type="number" id="nam" min="1900">
            </td>
        </tr>
        <tr>
            <td colspan="3" class="center-btn">
                <button type="button" onclick="xuatThu()">Xuất thứ</button>
            </td>
        </tr>
        <tr>
            <td colspan="3" class="result-cell" id="ketQua">
                <!-- Kết quả sẽ hiển thị ở đây -->
            </td>
        </tr>
    </table>

    <script src="/Script/script.js"></script>
</body>
</html>
